<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="AI marketing content engine generating and scheduling a month of social posts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF3E9"/>
      <stop offset="1" stop-color="#F1E3D1"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C1502E"/>
      <stop offset="1" stop-color="#A8431F"/>
    </linearGradient>
    <linearGradient id="photo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E8E5A"/>
      <stop offset="1" stop-color="#147248"/>
    </linearGradient>
    <clipPath id="postClip"><rect x="112" y="140" width="250" height="180" rx="16"/></clipPath>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1A1512" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1512" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="700" cy="120" r="130" fill="#C1502E" opacity="0.07"/>
  <circle cx="110" cy="500" r="150" fill="#147248" opacity="0.08"/>

  <!-- Card -->
  <rect x="80" y="100" width="640" height="420" rx="20" fill="#FFFFFF" stroke="rgba(26,21,18,0.12)" filter="url(#shadow)"/>

  <!-- Post preview -->
  <rect x="112" y="140" width="250" height="340" rx="16" fill="#FFFFFF" stroke="rgba(26,21,18,0.10)"/>
  <g clip-path="url(#postClip)">
    <rect x="112" y="140" width="250" height="180" fill="url(#photo)"/>
    <circle cx="300" cy="180" r="60" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="160" cy="300" r="46" fill="#FFFFFF" opacity="0.08"/>
  </g>
  <path d="M226 208l6 13 13 6-13 6-6 13-6-13-13-6 13-6z" fill="#FFFFFF" opacity="0.95"/>
  <rect x="130" y="338" width="186" height="12" rx="6" fill="#2A231C"/>
  <rect x="130" y="360" width="150" height="9" rx="4.5" fill="#B7A895"/>
  <rect x="130" y="378" width="168" height="9" rx="4.5" fill="#B7A895"/>
  <rect x="130" y="424" width="60" height="26" rx="13" fill="#A8431F"/>
  <text x="160" y="442" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Book</text>
  <path d="M270 430c-6-6-16 2 0 14 16-12 6-20 0-14z" fill="#A8431F"/>
  <text x="286" y="442" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#675D51">1.2k</text>

  <!-- Content calendar -->
  <text x="400" y="146" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1512">Content calendar</text>
  <rect x="620" y="128" width="90" height="24" rx="12" fill="#DCEFE4"/>
  <text x="665" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="11" fill="#147248">auto-post</text>

  <!-- Row 1 -->
  <rect x="400" y="166" width="300" height="82" rx="14" fill="#FFFFFF" stroke="rgba(26,21,18,0.10)"/>
  <rect x="416" y="182" width="50" height="50" rx="10" fill="url(#photo2)"/>
  <text x="480" y="196" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#A8431F">Mon · 9:00</text>
  <rect x="480" y="204" width="150" height="8" rx="4" fill="#2A231C"/>
  <rect x="480" y="218" width="110" height="7" rx="3.5" fill="#B7A895"/>
  <rect x="626" y="186" width="60" height="20" rx="10" fill="#DCEFE4"/>
  <text x="656" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#147248">scheduled</text>

  <!-- Row 2 -->
  <rect x="400" y="258" width="300" height="82" rx="14" fill="#FFFFFF" stroke="rgba(26,21,18,0.10)"/>
  <rect x="416" y="274" width="50" height="50" rx="10" fill="url(#photo)"/>
  <text x="480" y="288" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#A8431F">Wed · 12:30</text>
  <rect x="480" y="296" width="140" height="8" rx="4" fill="#2A231C"/>
  <rect x="480" y="310" width="120" height="7" rx="3.5" fill="#B7A895"/>
  <rect x="626" y="278" width="60" height="20" rx="10" fill="#DCEFE4"/>
  <text x="656" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#147248">scheduled</text>

  <!-- Row 3 -->
  <rect x="400" y="350" width="300" height="82" rx="14" fill="#FFFFFF" stroke="rgba(26,21,18,0.10)"/>
  <rect x="416" y="366" width="50" height="50" rx="10" fill="url(#photo2)"/>
  <text x="480" y="380" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#A8431F">Fri · 17:00</text>
  <rect x="480" y="388" width="156" height="8" rx="4" fill="#2A231C"/>
  <rect x="480" y="402" width="100" height="7" rx="3.5" fill="#B7A895"/>
  <rect x="626" y="370" width="60" height="20" rx="10" fill="#DCEFE4"/>
  <text x="656" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#147248">scheduled</text>

  <rect x="400" y="452" width="300" height="30" rx="15" fill="#F6DDD3"/>
  <text x="550" y="472" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#A8431F">+ 27 more posts ready</text>

  <!-- Floating: AI writes -->
  <g filter="url(#soft)">
    <rect x="452" y="34" width="308" height="60" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="486" cy="64" r="15" fill="#F6DDD3"/>
  <path d="M486 54l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#A8431F"/>
  <text x="512" y="60" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1512">AI writes &amp; designs</text>
  <text x="512" y="79" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#675D51">one month in one sitting</text>

  <!-- Floating: 30 posts -->
  <g filter="url(#soft)">
    <rect x="40" y="452" width="236" height="64" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="74" cy="484" r="15" fill="#DCEFE4"/>
  <path d="M74 474v12l8 5" fill="none" stroke="#147248" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="480" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#147248">30+</text>
  <text x="100" y="500" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#675D51">posts per month</text>
</svg>
