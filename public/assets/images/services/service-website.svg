<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Fast custom website with an AI assistant wired into every page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF3E9"/>
      <stop offset="1" stop-color="#F1E3D1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E8E5A"/>
      <stop offset="1" stop-color="#147248"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1A1512" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1512" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="110" cy="120" r="130" fill="#C1502E" opacity="0.07"/>
  <circle cx="700" cy="505" r="150" fill="#147248" opacity="0.08"/>

  <!-- Browser window -->
  <rect x="80" y="100" width="640" height="420" rx="18" fill="#FFFFFF" stroke="rgba(26,21,18,0.12)" filter="url(#shadow)"/>
  <path d="M80 118a18 18 0 0118-18h604a18 18 0 0118 18v28H80z" fill="#EFE2D0"/>
  <circle cx="110" cy="123" r="5" fill="#A8431F"/>
  <circle cx="128" cy="123" r="5" fill="#C1502E" opacity="0.7"/>
  <circle cx="146" cy="123" r="5" fill="#147248" opacity="0.7"/>
  <rect x="176" y="113" width="240" height="20" rx="10" fill="#FFFFFF"/>
  <text x="190" y="128" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="11" fill="#675D51">www.yourbusiness.com</text>

  <!-- Nav -->
  <circle cx="120" cy="178" r="12" fill="#A8431F"/>
  <rect x="142" y="172" width="74" height="12" rx="6" fill="#1A1512"/>
  <rect x="500" y="174" width="40" height="8" rx="4" fill="#B7A895"/>
  <rect x="552" y="174" width="34" height="8" rx="4" fill="#B7A895"/>
  <rect x="598" y="174" width="42" height="8" rx="4" fill="#B7A895"/>
  <rect x="652" y="166" width="50" height="24" rx="12" fill="#A8431F"/>

  <!-- Hero copy -->
  <rect x="112" y="222" width="280" height="20" rx="6" fill="#1A1512"/>
  <rect x="112" y="252" width="204" height="20" rx="6" fill="#1A1512"/>
  <rect x="112" y="292" width="272" height="9" rx="4.5" fill="#B7A895"/>
  <rect x="112" y="310" width="240" height="9" rx="4.5" fill="#B7A895"/>
  <rect x="112" y="338" width="134" height="42" rx="21" fill="#A8431F"/>
  <text x="179" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Get started</text>
  <rect x="258" y="338" width="112" height="42" rx="21" fill="#FFFFFF" stroke="rgba(26,21,18,0.16)"/>
  <text x="314" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#675D51">Book a call</text>

  <!-- Hero image -->
  <rect x="430" y="214" width="230" height="176" rx="14" fill="url(#hero)"/>
  <circle cx="640" cy="250" r="52" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="466" cy="360" r="40" fill="#FFFFFF" opacity="0.08"/>
  <path d="M545 268l8 17 17 8-17 8-8 17-8-17-17-8 17-8z" fill="#FFFFFF" opacity="0.9"/>

  <!-- AI widget -->
  <g filter="url(#soft)">
    <rect x="470" y="356" width="212" height="126" rx="16" fill="#FFFFFF" stroke="rgba(26,21,18,0.10)"/>
  </g>
  <rect x="470" y="356" width="212" height="36" rx="16" fill="#147248"/>
  <rect x="470" y="380" width="212" height="12" fill="#147248"/>
  <circle cx="492" cy="374" r="9" fill="#DCEFE4"/>
  <path d="M488 374h8M492 370v8" stroke="#147248" stroke-width="1.8" stroke-linecap="round"/>
  <text x="508" y="379" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">AI assistant</text>
  <circle cx="666" cy="374" r="4" fill="#DCEFE4"/>
  <rect x="484" y="404" width="150" height="30" rx="12" fill="#EFE2D0"/>
  <text x="496" y="423" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#2A231C">Hi! Ask me anything</text>
  <rect x="512" y="442" width="156" height="28" rx="12" fill="#A8431F"/>
  <text x="590" y="460" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#FFFFFF">Book me a slot</text>

  <!-- Connection -->
  <path d="M652 196 C700 240 690 320 620 360" fill="none" stroke="#A8431F" stroke-width="2" stroke-dasharray="6 7" opacity="0.55"/>
  <circle cx="652" cy="196" r="4" fill="#A8431F"/>

  <!-- Floating: live fast -->
  <g filter="url(#soft)">
    <rect x="452" y="34" width="308" height="60" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="486" cy="64" r="15" fill="#F6DDD3"/>
  <path d="M490 53l-8 13h7l-2 10 9-13h-7z" fill="#A8431F"/>
  <text x="512" y="60" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1512">Built &amp; live in 1–2 weeks</text>
  <text x="512" y="79" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#675D51">AI wired into every page</text>

  <!-- Floating: speed -->
  <g filter="url(#soft)">
    <rect x="40" y="452" width="236" height="64" rx="18" fill="#FFFFFF"/>
  </g>
  <circle cx="74" cy="484" r="15" fill="#DCEFE4"/>
  <path d="M74 474a10 10 0 00-8 16h3M74 474a10 10 0 018 16h-3M70 493l3 0" fill="none" stroke="#147248" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="480" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#147248">0.9s</text>
  <text x="100" y="500" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#675D51">fast, mobile-first</text>
</svg>
